apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhwa-agent-003-api
  namespace: fhwa-ai
  labels:
    app: fhwa-agent-003
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fhwa-agent-003
      component: api
  template:
    metadata:
      labels:
        app: fhwa-agent-003
        component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: fhwaacr.azurecr.io/fhwa-agent-003:1.0.0
          ports:
            - containerPort: 8005
          envFrom:
            - secretRef:
                name: fhwa-agent-003-secrets
            - configMapRef:
                name: fhwa-agent-003-config
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
          livenessProbe:
            httpGet: { path: /health, port: 8005 }
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8005 }
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhwa-agent-003-worker-realtime
  namespace: fhwa-ai
  labels:
    app: fhwa-agent-003
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fhwa-agent-003
      component: worker-realtime
  template:
    metadata:
      labels:
        app: fhwa-agent-003
        component: worker-realtime
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: fhwaacr.azurecr.io/fhwa-agent-003:1.0.0
          args: ["celery", "-A", "app.workers.tasks.celery_app", "worker",
                 "-Q", "realtime", "--loglevel=info", "--concurrency=2"]
          envFrom:
            - secretRef:
                name: fhwa-agent-003-secrets
            - configMapRef:
                name: fhwa-agent-003-config
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhwa-agent-003-beat
  namespace: fhwa-ai
  labels:
    app: fhwa-agent-003
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fhwa-agent-003
      component: beat
  template:
    metadata:
      labels:
        app: fhwa-agent-003
        component: beat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: beat
          image: fhwaacr.azurecr.io/fhwa-agent-003:1.0.0
          args: ["celery", "-A", "app.workers.tasks.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - secretRef:
                name: fhwa-agent-003-secrets
            - configMapRef:
                name: fhwa-agent-003-config
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fhwa-agent-003-api-hpa
  namespace: fhwa-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fhwa-agent-003-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
