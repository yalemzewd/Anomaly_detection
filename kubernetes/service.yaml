apiVersion: v1
kind: Service
metadata:
  name: fhwa-agent-003-api
  namespace: fhwa-ai
spec:
  type: ClusterIP
  selector:
    app: fhwa-agent-003
    component: api
  ports:
    - name: http
      port: 80
      targetPort: 8005
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fhwa-agent-003-ingress
  namespace: fhwa-ai
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: [traffic-agent.fhwa.dot.gov]
      secretName: fhwa-agent-003-tls
  rules:
    - host: traffic-agent.fhwa.dot.gov
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: fhwa-agent-003-api, port: { number: 80 } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fhwa-agent-003-netpol
  namespace: fhwa-ai
spec:
  podSelector:
    matchLabels:
      app: fhwa-agent-003
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx-ingress
      ports:
        - port: 8005
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
    - ports:
        - port: 443
