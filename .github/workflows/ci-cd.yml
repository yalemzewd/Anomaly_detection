name: FHWA-AGENT-003 CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: ruff check app/ tests/
      - run: mypy app/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: pytest tests/ -v --cov=app --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: bandit -r app/ -ll || true
      - run: safety check --full-report || true
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  build:
    runs-on: ubuntu-latest
    needs: security
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: fhwaacr.azurecr.io/fhwa-agent-003:${{ github.sha }},fhwaacr.azurecr.io/fhwa-agent-003:1.0.0

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: azure/aks-set-context@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          cluster-name: fhwa-aks
          resource-group: fhwa-ai-rg
      - run: |
          kubectl apply -f kubernetes/configmap.yaml -n fhwa-ai
          kubectl apply -f kubernetes/deployment.yaml -n fhwa-ai
          kubectl apply -f kubernetes/service.yaml -n fhwa-ai
          kubectl rollout status deployment/fhwa-agent-003-api -n fhwa-ai
