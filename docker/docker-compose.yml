version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8005:8005"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka

  worker-realtime:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app.workers.tasks.celery_app worker -Q realtime --loglevel=info --concurrency=2
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  worker-integrations:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app.workers.tasks.celery_app worker -Q integrations --loglevel=info --concurrency=1
    env_file:
      - ../.env
    depends_on:
      - redis

  worker-analytics:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app.workers.tasks.celery_app worker -Q analytics --loglevel=info --concurrency=1
    env_file:
      - ../.env
    depends_on:
      - redis

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A app.workers.tasks.celery_app beat --loglevel=info
    env_file:
      - ../.env
    depends_on:
      - redis

  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: fhwa_traffic_anomaly
      POSTGRES_USER: fhwa_user
      POSTGRES_PASSWORD: changeme
    ports:
      - "5435:5432"
    volumes:
      - pgdata003:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9094:9092"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"

  flower:
    image: mher/flower:2.0
    command: celery --broker=redis://redis:6379/0 flower --port=5557
    ports:
      - "5557:5557"
    depends_on:
      - redis

volumes:
  pgdata003:
